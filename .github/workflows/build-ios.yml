name: Build iOS (No Codesign)

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-15

    steps:

      # =========================================================
      # Checkout
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # Xcode
      # =========================================================

      - name: Select Xcode 26.3
        run: |
          set -e

          XCODE_PATH="/Applications/Xcode_26.3.app"

          if [ ! -d "$XCODE_PATH" ]; then
            echo "ERROR: Xcode 26.3 was not found."
            ls -la /Applications/ | grep Xcode || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          echo "========================================"
          echo "XCODE"
          echo "========================================"

          xcode-select -p
          xcodebuild -version

          echo ""
          echo "========================================"
          echo "SWIFT"
          echo "========================================"

          swift --version

          echo ""
          echo "========================================"
          echo "IOS SDK"
          echo "========================================"

          xcodebuild -showsdks | grep -i "iOS" || true

      # =========================================================
      # Flutter
      # =========================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Flutter
        run: |
          set -e

          git config --global http.postBuffer 1048576000
          git config --global http.version HTTP/1.1

          flutter config --enable-swift-package-manager

          echo "========================================"
          echo "FLUTTER"
          echo "========================================"

          flutter --version

      # =========================================================
      # Mapbox
      # =========================================================

      - name: Configure Mapbox Credentials
        env:
          SDK_REGISTRY_TOKEN: ${{ secrets.SDK_REGISTRY_TOKEN }}
        run: |
          set -e

          if [ -z "$SDK_REGISTRY_TOKEN" ]; then
            echo "ERROR: SDK_REGISTRY_TOKEN is missing."
            exit 1
          fi

          cat > "$HOME/.netrc" <<EOF
          machine api.mapbox.com
          login mapbox
          password ${SDK_REGISTRY_TOKEN}
          EOF

          chmod 600 "$HOME/.netrc"

          echo "Mapbox SDK credentials configured."

      # =========================================================
      # Flutter Dependencies
      # =========================================================

      - name: Install Flutter Dependencies
        run: |
          set -e
          flutter pub get

      # =========================================================
      # Clean
      # =========================================================

      - name: Clean iOS Build
        run: |
          set -e

          echo "========================================"
          echo "CLEANING"
          echo "========================================"

          flutter clean

          rm -rf build/ios_build
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -f ios/Podfile.lock

          flutter pub get

          echo "Clean completed."

      # =========================================================
      # Prepare iOS
      # =========================================================

      - name: Prepare iOS Project
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          MOYASAR_PUBLISHABLE_KEY: ${{ secrets.MOYASAR_PUBLISHABLE_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          AI_RAG_API_URL: ${{ secrets.AI_RAG_API_URL }}
        run: |
          set -e

          echo "========================================"
          echo "PREPARING IOS PROJECT"
          echo "========================================"

          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define=SERVER_URL="${SERVER_URL:-https://wicmn.alwaysdata.net/delever}" \
            --dart-define=MOYASAR_PUBLISHABLE_KEY="${MOYASAR_PUBLISHABLE_KEY}" \
            --dart-define=MAPBOX_ACCESS_TOKEN="${MAPBOX_ACCESS_TOKEN}" \
            --dart-define=AI_RAG_API_URL="${AI_RAG_API_URL:-https://delever-rag-service.vercel.app/api/ask-ai}"

          echo "Flutter iOS project prepared."

      # =========================================================
      # CocoaPods
      # =========================================================

      - name: Install CocoaPods Dependencies
        run: |
          set -e

          echo "========================================"
          echo "COCOAPODS"
          echo "========================================"

          cd ios

          pod install --no-repo-update

          cd ..

          if [ ! -f "ios/Podfile.lock" ]; then
            echo "ERROR: Podfile.lock was not created."
            exit 1
          fi

          if [ ! -d "ios/Pods" ]; then
            echo "ERROR: Pods directory was not created."
            exit 1
          fi

          echo "Podfile.lock:"
          ls -lh ios/Podfile.lock

          echo "Pods directory exists."

      # =========================================================
      # Build
      # =========================================================

      - name: Build iOS Release
        run: |
          set +e

          mkdir -p build

          echo "========================================"
          echo "XCODE BUILD"
          echo "========================================"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/ios_build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            PODS_PODFILE_DIR_PATH="$GITHUB_WORKSPACE/ios" \
            PODS_ROOT="$GITHUB_WORKSPACE/ios/Pods" \
            -skipPackagePluginValidation \
            -showBuildTimingSummary \
            2>&1 | tee build/ios_build.log

          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          echo "Exit code: $BUILD_EXIT_CODE"

          echo ""
          echo "========================================"
          echo "ERRORS"
          echo "========================================"

          grep -nE \
            "error:|fatal error:|BUILD FAILED|Command .* failed|SwiftCompile.*failed|CompileSwift.*failed" \
            build/ios_build.log || true

          echo ""
          echo "========================================"
          echo "LAST 100 LOG LINES"
          echo "========================================"

          tail -n 100 build/ios_build.log || true

          exit "$BUILD_EXIT_CODE"

      # =========================================================
      # Create Proper IPA
      # =========================================================

      - name: Package Unsigned IPA
        if: success()
        run: |
          set -e

          echo "========================================"
          echo "CREATING IPA"
          echo "========================================"

          APP_PATH="build/ios_build/Build/Products/Release-iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Expected Runner.app not found."
            echo "Searching..."

            APP_PATH=$(find build/ios_build \
              -type d \
              -name "Runner.app" \
              | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app was not found."

            find build/ios_build \
              -type d \
              -name "*.app" \
              -print || true

            exit 1
          fi

          echo ""
          echo "Runner.app:"
          echo "$APP_PATH"

          # =======================================================
          # Remove previous files
          # =======================================================

          rm -rf ipa_work
          rm -f Runner.ipa

          # =======================================================
          # Create exact IPA structure
          #
          # ipa_work/
          #   Payload/
          #     Runner.app/
          # =======================================================

          mkdir -p "ipa_work/Payload"

          echo ""
          echo "Copying Runner.app..."

          ditto "$APP_PATH" "ipa_work/Payload/Runner.app"

          # =======================================================
          # Verify application before packaging
          # =======================================================

          echo ""
          echo "========================================"
          echo "VERIFYING APP"
          echo "========================================"

          if [ ! -d "ipa_work/Payload/Runner.app" ]; then
            echo "ERROR: Runner.app was not copied."
            exit 1
          fi

          if [ ! -f "ipa_work/Payload/Runner.app/Runner" ]; then
            echo "ERROR: Runner executable does not exist."
            exit 1
          fi

          if [ ! -f "ipa_work/Payload/Runner.app/Info.plist" ]; then
            echo "ERROR: Info.plist does not exist."
            exit 1
          fi

          echo "Runner.app exists."
          echo "Runner executable exists."
          echo "Info.plist exists."

          # =======================================================
          # Create IPA
          #
          # We enter ipa_work so Payload is at the archive root.
          # =======================================================

          echo ""
          echo "========================================"
          echo "CREATING RUNNER.IPA"
          echo "========================================"

          cd ipa_work

          ditto -c -k --sequesterRsrc --keepParent \
            Payload \
            ../Runner.ipa

          cd ..

          # =======================================================
          # Remove working directory
          # =======================================================

          rm -rf ipa_work

          # =======================================================
          # Verify IPA exists
          # =======================================================

          echo ""
          echo "========================================"
          echo "VERIFYING IPA"
          echo "========================================"

          if [ ! -f "Runner.ipa" ]; then
            echo "ERROR: Runner.ipa was not created."
            exit 1
          fi

          ls -lh Runner.ipa

          # =======================================================
          # Verify ZIP
          # =======================================================

          echo ""
          echo "Testing ZIP integrity..."

          unzip -t Runner.ipa

          # =======================================================
          # Show structure
          # =======================================================

          echo ""
          echo "========================================"
          echo "IPA CONTENTS"
          echo "========================================"

          unzip -l Runner.ipa | head -n 80

          # =======================================================
          # Required IPA structure
          # =======================================================

          echo ""
          echo "========================================"
          echo "CHECKING IPA STRUCTURE"
          echo "========================================"

          if ! unzip -l Runner.ipa | grep -q "Payload/Runner.app/"; then
            echo "ERROR: Payload/Runner.app was not found."
            exit 1
          fi

          if ! unzip -l Runner.ipa | grep -q "Payload/Runner.app/Runner"; then
            echo "ERROR: Runner executable was not found."
            exit 1
          fi

          if ! unzip -l Runner.ipa | grep -q "Payload/Runner.app/Info.plist"; then
            echo "ERROR: Info.plist was not found."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "IPA VALIDATION SUCCESS"
          echo "========================================"

          echo "Payload/Runner.app/       OK"
          echo "Payload/Runner.app/Runner OK"
          echo "Info.plist                OK"

          echo ""
          echo "========================================"
          echo "IPA CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh Runner.ipa

      # =========================================================
      # Upload Build Log
      # =========================================================

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Build-Log
          path: build/ios_build.log
          if-no-files-found: ignore
          retention-days: 14

      # =========================================================
      # Upload IPA
      # =========================================================

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-ipa
          path: Runner.ipa
          if-no-files-found: error
          retention-days: 14