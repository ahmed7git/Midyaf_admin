name: Build iOS (No Codesign)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA & Runner.app (Unsigned)
    runs-on: macos-15

    steps:
      # =========================================================
      # 1. استرجاع الكود المصدري
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. تحديد Xcode مع التحقق من iOS SDK فعليًا
      # =========================================================
      - name: Select Xcode Toolchain
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "DETECTING XCODE WITH AVAILABLE IOS SDK"
          echo "========================================"

          XCODE_PATH=""

          # نفحص Xcode المثبت فعليًا، من الأحدث إلى الأقدم،
          # ونختار أول نسخة تحتوي على iPhoneOS SDK صالح.
          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue

            echo "Checking: $candidate"

            if [ ! -d "$candidate/Contents/Developer" ]; then
              continue
            fi

            sudo xcode-select -s "$candidate/Contents/Developer"

            if SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)" &&
               [ -d "$SDK_PATH" ]; then

              SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || true)"

              if [ -n "$SDK_VERSION" ]; then
                XCODE_PATH="$candidate"
                echo "Selected Xcode: $XCODE_PATH"
                echo "Selected iOS SDK: $SDK_VERSION"
                echo "SDK path: $SDK_PATH"
                break
              fi
            fi
          done < <(
            find /Applications \
              -maxdepth 1 \
              -type d \
              -name "Xcode*.app" \
              | sort -V -r
          )

          if [ -z "$XCODE_PATH" ]; then
            echo "ERROR: No Xcode installation with a valid iPhoneOS SDK was found."
            echo "Installed Xcode versions:"
            find /Applications \
              -maxdepth 1 \
              -type d \
              -name "Xcode*.app" \
              -print \
              | sort -V -r || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          echo "========================================"
          echo "XCODE DETAILS"
          echo "========================================"

          xcode-select -p
          xcodebuild -version

          echo "========================================"
          echo "SWIFT VERSION"
          echo "========================================"

          swift --version

          echo "========================================"
          echo "AVAILABLE IOS SDK"
          echo "========================================"

          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          xcodebuild -showsdks | grep -i "iOS" || true

      # =========================================================
      # 3. تثبيت Flutter
      # =========================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # =========================================================
      # 4. إعداد Flutter
      #
      # مهم:
      # Flutter 3.47.x يفعّل Swift Package Manager افتراضيًا.
      # المشروع يعتمد على CocoaPods، وخصوصًا مع
      # google_maps_flutter_ios، لذلك نعطّل SPM صراحة.
      # =========================================================
      - name: Configure Flutter
        shell: bash
        run: |
          set -e

          git config --global http.postBuffer 1048576000
          git config --global http.version HTTP/1.1

          echo "========================================"
          echo "DISABLING SWIFT PACKAGE MANAGER"
          echo "========================================"

          flutter config --no-enable-swift-package-manager

          echo "========================================"
          echo "FLUTTER VERSION"
          echo "========================================"

          flutter --version

          echo "========================================"
          echo "FLUTTER CONFIG"
          echo "========================================"

          flutter config

      # =========================================================
      # 5. إعداد بيانات Mapbox الاختيارية
      # =========================================================
      - name: Configure Mapbox Credentials (Optional)
        env:
          SDK_REGISTRY_TOKEN: ${{ secrets.SDK_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -e

          if [ -n "$SDK_REGISTRY_TOKEN" ]; then
            cat > "$HOME/.netrc" <<EOF
          machine api.mapbox.com
          login mapbox
          password ${SDK_REGISTRY_TOKEN}
          EOF

            chmod 600 "$HOME/.netrc"

            echo "Mapbox SDK credentials configured."
          else
            echo "No SDK_REGISTRY_TOKEN provided."
            echo "Continuing with default configuration."
          fi

      # =========================================================
      # 6. تنزيل Dependencies
      # =========================================================
      - name: Install Flutter Dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FLUTTER PUB GET"
          echo "========================================"

          flutter pub get

      # =========================================================
      # 7. تنظيف بيئة iOS
      # =========================================================
      - name: Clean iOS Build
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CLEANING IOS BUILD"
          echo "========================================"

          flutter clean

          rm -rf build/ios_build
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral
          rm -f ios/Podfile.lock

          flutter pub get

      # =========================================================
      # 8. التحقق من ملفات مشروع iOS
      # =========================================================
      - name: Verify iOS Project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING IOS PROJECT"
          echo "========================================"

          if [ ! -d "ios" ]; then
            echo "ERROR: ios directory does not exist."
            exit 1
          fi

          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "ERROR: Xcode project file not found."
            echo "Expected:"
            echo "ios/Runner.xcodeproj/project.pbxproj"
            exit 1
          fi

          if [ ! -f "ios/Podfile" ]; then
            echo "ERROR: ios/Podfile not found."
            exit 1
          fi

          if [ ! -f "ios/Flutter/Debug.xcconfig" ]; then
            echo "WARNING: Debug.xcconfig not found."
          fi

          if [ ! -f "ios/Flutter/Release.xcconfig" ]; then
            echo "WARNING: Release.xcconfig not found."
          fi

          echo "iOS project files verified."

      # =========================================================
      # 9. تجهيز مشروع iOS وحقن Dart Defines
      # =========================================================
      - name: Prepare iOS Project
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING IOS PROJECT"
          echo "========================================"

          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define=SERVER_URL="${SERVER_URL:-https://wicmn.alwaysdata.net/delever}" \
            --dart-define=MAPBOX_ACCESS_TOKEN="${MAPBOX_ACCESS_TOKEN}" \
            --dart-define=GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY}" \
            --dart-define=APP_SECRET_KEY="${APP_SECRET_KEY}"

          echo "Flutter iOS project prepared successfully."

      # =========================================================
      # 10. تثبيت CocoaPods
      # =========================================================
      - name: Install CocoaPods Dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALLING COCOAPODS"
          echo "========================================"

          cd ios

          pod install --repo-update

          cd ..

          if [ ! -f "ios/Podfile.lock" ]; then
            echo "ERROR: Podfile.lock was not created."
            exit 1
          fi

          if [ ! -d "ios/Pods" ]; then
            echo "ERROR: Pods directory was not created."
            exit 1
          fi

          if [ ! -f "ios/Runner.xcworkspace/contents.xcworkspacedata" ]; then
            echo "ERROR: Runner.xcworkspace was not created correctly."
            exit 1
          fi

          echo "Pods installed successfully."

      # =========================================================
      # 11. بناء تطبيق iOS Release بدون Codesign
      # =========================================================
      - name: Build iOS Release
        shell: bash
        run: |
          set +e

          mkdir -p build

          echo "========================================"
          echo "STARTING XCODEBUILD"
          echo "========================================"

          echo "Xcode:"
          xcodebuild -version

          echo "iOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/ios_build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            PODS_PODFILE_DIR_PATH="$GITHUB_WORKSPACE/ios" \
            PODS_ROOT="$GITHUB_WORKSPACE/ios/Pods" \
            -showBuildTimingSummary \
            2>&1 | tee build/ios_build.log

          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          echo "========================================"
          echo "BUILD RESULT: Exit code $BUILD_EXIT_CODE"
          echo "========================================"

          if [ "$BUILD_EXIT_CODE" -ne 0 ]; then
            echo "========================================"
            echo "ERRORS FOUND IN BUILD LOG"
            echo "========================================"

            grep -nE \
              "error:|fatal error:|BUILD FAILED|Command .* failed|SwiftCompile.*failed|CompileSwift.*failed" \
              build/ios_build.log || true

            echo "========================================"
            echo "LAST 150 LOG LINES"
            echo "========================================"

            tail -n 150 build/ios_build.log || true

            exit "$BUILD_EXIT_CODE"
          fi

      # =========================================================
      # 12. العثور على Runner.app
      # =========================================================
      - name: Locate Runner.app
        if: success()
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "LOCATING RUNNER.APP"
          echo "========================================"

          APP_PATH="build/ios_build/Build/Products/Release-iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found at default path."
            echo "Searching derived data..."

            APP_PATH=$(find build/ios_build \
              -type d \
              -name "Runner.app" \
              | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app was not found."
            echo "Available .app files:"

            find build/ios_build \
              -type d \
              -name "*.app" \
              -print || true

            exit 1
          fi

          echo "Found Runner.app at:"
          echo "$APP_PATH"

          echo "$APP_PATH" > runner_app_path.txt

      # =========================================================
      # 13. التحقق من أيقونة التطبيق داخل Runner.app
      # =========================================================
      - name: Verify App Icon in Runner.app
        if: success()
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APP ICON IN RUNNER.APP"
          echo "========================================"

          APP_PATH=$(cat runner_app_path.txt)

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app does not exist."
            exit 1
          fi

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Runner.app/Info.plist was not found."
            exit 1
          fi

          if [ ! -f "$APP_PATH/Assets.car" ]; then
            echo "ERROR: Assets.car was not found inside Runner.app."
            echo "The asset catalog may not have been compiled into the app."
            exit 1
          fi

          echo "Assets.car found: OK"

          echo "----------------------------------------"
          echo "Checking CFBundleIconName"
          echo "----------------------------------------"

          ICON_NAME=$(
            /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP_PATH/Info.plist" 2>/dev/null || true
          )

          if [ "$ICON_NAME" = "AppIcon" ]; then
            echo "CFBundleIconName = AppIcon : OK"
          else
            echo "WARNING: CFBundleIconName is '$ICON_NAME'"
            echo "Full icon-related Info.plist entries:"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP_PATH/Info.plist" 2>/dev/null || true
          fi

          echo "----------------------------------------"
          echo "Inspecting compiled Assets.car"
          echo "----------------------------------------"

          if xcrun assetutil --info "$APP_PATH/Assets.car" > build/app_assets_info.json 2>&1; then
            if grep -q "AppIcon" build/app_assets_info.json; then
              echo "AppIcon found inside compiled Assets.car : OK"
            else
              echo "WARNING: AppIcon was not explicitly found in assetutil output."
            fi
          else
            echo "WARNING: assetutil could not inspect Assets.car."
          fi

          echo "----------------------------------------"
          echo "Source AppIcon configuration"
          echo "----------------------------------------"

          grep -n "ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon" \
            ios/Runner.xcodeproj/project.pbxproj || true

          echo "========================================"
          echo "APP ICON VERIFICATION FINISHED"
          echo "========================================"

      # =========================================================
      # 14. تحزيم Runner.app و Runner.ipa
      # =========================================================
      - name: Package Unsigned IPA and Runner.app
        if: success()
        shell: bash
        run: |
          set -e

          APP_PATH=$(cat runner_app_path.txt)

          echo "========================================"
          echo "PACKAGING IOS ARTIFACTS"
          echo "========================================"

          # -------------------------------------------------------
          # Runner.app.zip
          # -------------------------------------------------------
          echo "Creating Runner.app.zip..."

          rm -f Runner.app.zip

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            Runner.app.zip

          # -------------------------------------------------------
          # Runner.ipa
          # -------------------------------------------------------
          rm -rf ipa_work
          rm -f Runner.ipa

          mkdir -p "ipa_work/Payload"

          echo "Copying Runner.app into Payload..."

          ditto \
            "$APP_PATH" \
            "ipa_work/Payload/Runner.app"

          # -------------------------------------------------------
          # التحقق من الملفات الأساسية
          # -------------------------------------------------------
          if [ ! -f "ipa_work/Payload/Runner.app/Runner" ]; then
            echo "ERROR: Runner executable does not exist."
            exit 1
          fi

          if [ ! -f "ipa_work/Payload/Runner.app/Info.plist" ]; then
            echo "ERROR: Info.plist does not exist."
            exit 1
          fi

          # -------------------------------------------------------
          # إنشاء IPA
          # -------------------------------------------------------
          echo "Packaging Runner.ipa..."

          cd ipa_work

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            ../Runner.ipa

          cd ..

          rm -rf ipa_work

          # =======================================================
          # فحص IPA
          # =======================================================
          echo "========================================"
          echo "VERIFYING RUNNER.IPA"
          echo "========================================"

          ls -lh Runner.ipa Runner.app.zip

          unzip -t Runner.ipa

          if ! unzip -l Runner.ipa | grep -q "Payload/Runner.app/Runner"; then
            echo "ERROR: Runner executable not found in Runner.ipa."
            exit 1
          fi

          echo "========================================"
          echo "SUCCESS"
          echo "========================================"

          echo "Runner.ipa created successfully."
          echo "Runner.app.zip created successfully."

      # =========================================================
      # 14. رفع سجل البناء
      # =========================================================
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Build-Log
          path: build/ios_build.log
          if-no-files-found: ignore
          retention-days: 14

      # =========================================================
      # 15. رفع IPA
      # =========================================================
      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-ipa
          path: Runner.ipa
          if-no-files-found: error
          retention-days: 14

      # =========================================================
      # 16. رفع Runner.app
      # =========================================================
      - name: Upload Runner.app Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app
          path: Runner.app.zip
          if-no-files-found: error
          retention-days: 14
